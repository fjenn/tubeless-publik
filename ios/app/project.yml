# XcodeGen: `xcodegen generate` here makes Tubeless.xcodeproj (not kept in git).
# The Kotlin side is built first (./gradlew :ios:linkReleaseFrameworkIosArm64) and its
# TubelessKit.framework (the Kotlin module) copied to ios/build/kit (the workflow does both).
name: Tubeless
options:
  deploymentTarget:
    iOS: "16.0"
targets:
  Tubeless:
    type: application
    platform: iOS
    sources:
      - App.swift
      - Downloads.swift
      - Translator.swift
      - Assets.xcassets
      # SABR (WebSabr): the page script and yt-dlp's solver it runs (common/sabr, common/ejs)
      - path: ../../common/sabr/sabr-page.js
        buildPhase: resources
      - path: ../../common/ejs/yt.solver.lib.min.js
        buildPhase: resources
      - path: ../../common/ejs/yt.solver.core.min.js
        buildPhase: resources
      # Roboto, YouTube's typeface (SIL Open Font License, common/fonts)
      - path: ../../common/fonts/RobotoVariable.ttf
        buildPhase: resources
      - path: ../../common/fonts/Roboto-OFL.txt
        buildPhase: resources
    dependencies:
      - framework: ../build/kit/TubelessKit.framework
        embed: false
      # comment translation (iOS 18+): linked weakly so the app still opens on iOS 16 and 17,
      # where this framework is missing or has no TranslationSession
      - sdk: Translation.framework
        weak: true
      # voice search (IosSpeech)
      - sdk: Speech.framework
      # the comment's language, so "Translate" shows only under the ones in another language (IosPlatform)
      - sdk: NaturalLanguage.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.tubeless.app
        PRODUCT_NAME: Tubeless
        INFOPLIST_FILE: Info.plist
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        FRAMEWORK_SEARCH_PATHS: "$(inherited) $(SRCROOT)/../build/kit"
        ENABLE_BITCODE: NO
        # App Store / TestFlight (scripts/release-ios-testflight.sh): automatic signing for this
        # team; CI's simulator build passes CODE_SIGNING_ALLOWED=NO. Bump CURRENT_PROJECT_VERSION
        # for every upload (the script does it).
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "10"
        DEVELOPMENT_TEAM: "$(APPLE_TEAM_ID)"
        CODE_SIGN_STYLE: Automatic
